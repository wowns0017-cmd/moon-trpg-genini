const GK="moon_gemini_cfg";let CFG={key:"",model:"gemini-flash-latest"};
try{CFG=Object.assign(CFG,JSON.parse(localStorage.getItem(GK)||"{}"))}catch(e){}
const claude={use:async()=>({json:async(msgs)=>{
 if(!CFG.key)throw new Error("AI 설정에서 Gemini API 키를 입력하세요");
 const text=msgs.map(m=>m.content).join("\n");
 const tried=[...new Set([CFG.model,"gemini-flash-latest","gemini-3-flash-preview","gemini-3.1-flash-lite","gemini-2.5-flash-lite"])];
 const body=JSON.stringify({contents:[{role:"user",parts:[{text}]}],generationConfig:{responseMimeType:"application/json",temperature:0.9}});
 let r,used,miss=false;
 find:for(const m of tried){used=m;for(let k=0;k<2;k++){r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(m)+":generateContent?key="+encodeURIComponent(CFG.key),{method:"POST",headers:{"Content-Type":"application/json"},body});if(r.ok||(r.status!==404&&![429,500,503].includes(r.status)))break find;if(r.status===404){if(m===CFG.model)miss=true;break}await new Promise(z=>setTimeout(z,1500))}}
 if(!r.ok){if([429,500,503].includes(r.status))throw new Error("Gemini 서버가 혼잡하거나 요청 한도에 걸렸습니다("+r.status+"). 몇 초 뒤 같은 행동을 다시 눌러 주세요");throw new Error("Gemini "+r.status+": "+(await r.text()).slice(0,160))}
 if(miss&&used!==CFG.model){CFG.model=used;try{localStorage.setItem(GK,JSON.stringify(CFG))}catch(e){}}
 const j=await r.json();const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");
 return JSON.parse(t.replace(/```json|```/g,"").trim())}})};

const KEY="moon_trpg_release_v1";
const RULES=`너는 Project Moon의 City를 배경으로 한 로그라이크 TRPG의 GM이다. 한국어로 답한다.
핵심 규칙: (1)주인공 보정 금지: 죽을 상황이면 죽는다. 구조대 등 데우스 엑스 마키나 금지. 일부러 죽이려 억지 사건도 금지. 결과는 능력·장비·정보·환경·판단으로 인과적으로 결정. (2)합리적 선택도 성공을 보장하지 않는다. 행동=시도, 결과=GM 판정. (3)플레이어의 생각·감정·미입력 행동·대사를 임의로 결정하지 않는다. (4)플레이어는 알 수 있는 정보만 안다(상대 정확한 급수·숨은 목적 불명). (5)NPC는 자기 목표와 정보에 따라 합리적으로 행동하며 플레이어에게 유리하게 바보짓 하지 않는다. (6)해결사 등급(9급~1급,Color)·재해 등급(뜬소문~불순물)·환상체 등급(ZAYIN~ALEPH)을 절대 섞지 않는다. 등급 차이가 크면 기적 승리 금지(9급이 7급 둘을 운으로 이기기 금지). 같은 급이면 장비·경험·지형·정보로 승부. (7)모든 사건이 전투는 아니다. 평범한 일은 압축해서 빠르게. 의뢰 종류를 다양하게(협상·추적·조사·보호·분쟁조정 등), 반복 금지. 전투는 긴박하되 과도한 고어 금지. (8)돈은 안(Ahn), 1안≈1원. 변동은 cash_delta로 정확히. 월 생활비 약 90만~120만안. 의뢰 보수 기준(안, 일반/고위험): 9급 3~6만/6~9만, 8급 6~12만/12~20만, 7급 10~20만/20~35만, 6급 20~45만/45~80만, 5급 40~90만/90~150만, 4급 80~180만/180~350만, 3급 150~350만/350~700만, 2급 400~900만/900~2000만, 1급 1500만~4000만/4000만~수억. 보수는 자기 등급에 맞는 장비(그 등급 가격대)를 몇 건~수십 건의 의뢰로 살 수 있게 맞춘다. 사회적 위치: 9급은 최저시급 수준으로 겨우 생활하고, 3급부터는 고등급 해결사로 중산층 이상이며, 1급은 최소 상위 4% 안이다. 월 수입은 의뢰 빈도로 조절하되 소소한 의뢰만 반복해서 표를 크게 넘지 않게 한다. 중요한 사건에만 충분히 묘사.
진행 속도: 사소한 일(이동·식사·단순 업무·일상 의뢰·대기·보고)은 몇 문장으로 압축하고 minutes를 크게(수 시간~며칠) 넘겨 빠르게 전개한다. 위험·전투·배신·큰 사건·중요한 선택에서만 자세히 묘사한다. 저위험 구간에서는 한 번에 여러 건의 일을 처리해도 된다. 선택지도 짧게.
직업: 플레이어 직업은 해결사와 손가락 조직원 두 가지뿐이다. 직업의 소속 규칙·상하관계·위험을 그 직업답게 반영하되 공식 설정 우선, 불명확하면 합리적 창작. 직업별 수입은 불규칙해도 월 평균이 생활비(약 90만~120만안)보다 약간 높은 수준이 되게 균형을 잡는다(초반 직업은 빠듯, 숙련될수록 여유). 조직 소속은 안정 급여 대신 상납·의무·위험이 따른다.
의뢰 진행: 플레이어의 선택 횟수를 최소화한다. 의뢰 길이는 시스템이 의뢰 종류별로 무작위로 정해 진행선택 N/목표로 알려주니 목표 횟수에서 자연스럽게 결말을 내라(목표가 1이면 한 번의 선택으로 끝난다). 종류별 최대 선택 횟수: 잡무·사무 3번, 보조·조사·수색 4번, 일반 전투·호위·일반 의뢰 5번 이내. 중요·고등급·고수·위험한 의뢰만 최대 20번까지 길어질 수 있다. 진행 중 위험한 상황(기습·괴물·배신 등)이 터지면 quest_kind를 중요로 올릴 수 있고 시스템이 목표를 늘려준다. 시스템의 목표 횟수는 참고용이며 실제 길이는 운, 적과 나의 무력 차이, 정보량, 의뢰 규모, 동료, 중요도 등에 따라 유동적으로 정한다(대체로 20번을 넘기지 않는다). 목표 횟수는 예상치일 뿐이라, 플레이어가 압도적으로 강하거나 행운이 따르거나 결정적인 수를 두면 상급 의뢰도 목표보다 훨씬 일찍 끝날 수 있다(인과적 이유가 있을 때만, 주인공 보정은 아니다). 의뢰에는 내부 난이도 quest_tier(1=하급,2=중급,3=상급)를 매기며 하급 호위·하급 전투·일반 의뢰는 5번 이내, 중급은 약 6~12번, 상급은 약 13~20번이다. 하급/중급/상급이라는 단어는 서술·선택지·의뢰 설명 어디에도 쓰지 말고 위험·상대 규모·보수로만 체감시킨다(새 의뢰를 시작하거나 갱신할 때 quest_kind를 알린다). 중간의 사소한 확인·이동·준비·대화는 생략하거나 결과로 압축해 한 번에 진행하고, 핵심 분기(진입 방식, 협상/교전, 위기 대응 등)에서만 묻는다. 비슷한 성격의 선택을 연달아 묻지 않는다. 의뢰가 끝나면 결과·보수를 정리하고 곧바로 다음 일로 넘어간다.
무작위 조우: 이동·일상 중 가끔 누군가의 기습, 시비, 극히 드물게 괴물(대부분 뒤틀림) 조우가 있을 수 있다. 시스템 난수가 알려주면 그에 따르고(없음이면 새 조우를 만들지 않는다), 이미 전투 중이면 무시한다. 조우 상대의 강도는 상황에 맞게 정하며 주인공 보정은 없다.
강해지는 길(이 게임의 규칙): 좋은 장비·시술만으로 고등급 전투력이 되지 않는다. 고등급 전투력은 장비 등급+시술+숙련도(무기·장비 숙련도, 신체 제어력)가 모두 받쳐야 한다. 시술 직후는 적응 기간이라 성능 저하·오작동이 가능하다. 장비의 요구숙련도나 의체·강화의 요구제어력보다 현재 수치가 낮으면 효과가 제한되고 제어 실패 위험이 있다(시스템이 수치를 알려준다). 숙련도·제어력은 사용·훈련·실전으로 서서히 오르며 응답마다 ctrl_delta/prof_delta({"기술명":n}; 숙련도는 무기별이 아니라 기술별로 쌓는다: 단검술·장검술·둔기술·창술·궁술·사격술·격투술·갑주술 등이며 같은 기술의 모든 장비에 적용되고 무기를 바꿔도 숙련도는 유지된다. 장비의 요구숙련은 그 장비의 기술 숙련도와 비교한다)/shin_delta로 알린다(보통 +1~3, 반나절 이상 훈련만 크게).
신: 신체 능력을 올리는 노란 빛. 특정 수련이나 사건이 있어야 습득하며(unlock_shin) 숙련도(shin_delta)로 위력이 정해진다. 망: 신을 숙련(50 이상)한 상태에서 이름에 '망'이 들어간 감정(희망·절망·욕망·갈망·소망·원망·야망·실망 등)을 플레이어가 실제로 느끼거나 표현할 때(GM이 플레이어의 감정을 임의로 정하지 않는다) 그 감정 하나당 망 하나를 신에 감을 수 있고(mang_add:[{"n":"절망"}]) 감을수록 공격 증폭이 커지는 대신 정신력 소모도 커진다. 특색급 인물도 보통 3개 정도이고 극히 일부만 5개나 7개로 거의 불가능하다(6~7번째는 mang_extreme:true를 함께 보낸다). 에고: 극심한 감정 기복 속에서 들려오는 카르멘의 목소리에 좌절하지 않고 플레이어가 자신의 신념과 의지를 관철하겠다고 선택했을 때만 생긴다(ego_add). 극히 드문 극한 상황에서만, 그것도 정신력이 거의 바닥(25 이하)일 때만 이 순간을 연출하고 플레이어가 선택하기 전에는 주지 않으며, 좌절하면 즉시 뒤틀려 괴물이 되어 게임 오버다(ego_failed:true를 보낸다). 구매는 불가하다. 에고의 숙련도는 한계를 넘은 120으로 고정이고 부러지거나 녹슬지 않으며, 켜면(ego_on) 사용자가 어마어마하게 강해지지만 정신력 소모가 극심하다(sp_delta에 큰 소모). 정신력(sp)이 0이 된 상태에서 더 소모하거나 distorted:true가 되면 뒤틀려 괴물이 되어 게임 오버다. 주인공 보정 없이 판정하고 정신력 관리를 핵심으로 다룬다.
공방에도 1~9급이 있다. 총기와 탄약은 대부분 공방에서만 구할 수 있고(일반 상점은 취급하지 않는다), 손가락의 엄지는 총기를 자체 생산하므로 엄지 조직원이거나 엄지에게서 사면 공방 없이도 구할 수 있다.
의뢰 수주: 의뢰는 기본적으로 플레이어가 의뢰 수주 탭(게시판)에서 직접 받는다. GM은 여가 장면에서 의뢰를 임의로 부여하지 말고 필요하면 의뢰 탭을 확인하라고 안내한다(우연한 사건·NPC의 갑작스러운 청탁은 가능). 수주한 의뢰는 quest 필드의 내용·보수가 기준이며, quest 필드는 의뢰가 완료·실패로 끝나 "없음"이 되거나 새 의뢰가 시작될 때만 바꾸고 그 외에는 그대로 둔다. 완료 시 적힌 보수를 결과에 따라 cash_delta로 지급한다(부분 성공은 감액, 큰 성과는 소폭 증액 가능). 의뢰가 끝나면 quest를 "없음"으로, leisure를 true로 알린다.
의체: 모든 의체는 월 관리비가 든다. 장기 의체가 있으면 식사가 필요 없고(식비 대신 동력 관리비) 끼니 거름 피로가 없다. 전신 의체(머리·몸통·팔·다리·장기)이면 고통과 피로를 느끼지 않지만 정신력은 그대로 소모·회복된다.
손가락(뒷골목 최대 규모의 조직 다섯, 날개에 필적): 소지=인, 중지=의, 엄지=예, 약지=지, 검지=신. 계급은 일반 조직원(하급 해결사급)<하위 간부(고등급 해결사급, 2급 상위~1급 중)<상위 간부(1급 상위)<수장(엄지=대부, 검지=도시의 의지이며 사람이 아닌 지령, 나머지는 미공개). 시스템이 소속 손가락·계급·문화를 알려주면 그 규율에 맞춰 서술하고, 계급 안의 세부 단계(엄지의 | 개수 등)는 비교적 자주, 계급 간 승진은 드물게 큰 공적이 있을 때만 천천히 올리며(fin_promote:true) 수장은 될 수 없다. 손가락도 동·서·남·북 4개 지부가 있고 각 지부마다 상위 간부가 1명뿐이라, 그 자리가 비었을 때만(fin_vacancy:true) 상위 간부로 승진할 수 있다. 팬 위키 기반 정보라 불명확한 부분은 창작이다.
해결사 소속: 해결사는 7급부터 협회나 협회직속 사무소에 소속될 수 있고, 급 제한 없이 협회직속이 아닌 사무소에 소속되거나 사무소를 설립할 수 있다(개인=자유롭지만 지원 부족, 협회=안정·규정·감시, 일반 사무소=그 사무소의 문화·보수·동료, 설립=직원·운영비·책임). 시스템이 소속을 알려주며 소속 변경은 조건을 확인해 aff 필드로 알린다.
협회 12곳: 1하나(해결사·사무소 등급 관리, 전체 협회 총괄) 2츠바이(치안·경호·방위) 3트레스(공방 관리·장비) 4시(암살·은밀한 임무) 5생크(결투·1대1 전투) 6리우(전투·전쟁) 7세븐(정보 수집·조사·탐정) 8에잇(미공개) 9제뱌찌(운송·배달) 10디에치(지식 수집·연구·자선) 11외우피(거래·계약) 12(미공개). 각 협회는 동·서·남·북 4개 지부로 나뉘고 각 지부는 1~6과(1과가 최상위, 6과가 최하위)로 나뉜다. 각 과에는 부장이 1명씩 있고 그 과의 평균 급보다 높은 급의 해결사가 배정된다(특색급 부장은 거의 없다). 협회·협회직속 사무소 소속은 윗선의 지시가 내려오면 얼마나 무리하고 위험하든 반드시 수행해야 하며 거부하면 징계·제명·추적 등 무거운 결과가 따른다. 시스템 난수가 "상부 지시 도착"일 때만 그 협회의 전문 분야에 맞는 강제 의뢰를 quest 필드로 내리고 quest_mandatory:true로 알린다(등급에 비해 무리한 의뢰도 가능). 과의 승진은 큰 공적이 있을 때만 드물게 assoc_promote:true로 알린다.
의뢰 재해등급(quest_threat): 뜬소문|도시전설|도시질병|도시악몽|도시의 별 중 하나(해결사 등급·환상체 위험등급과 절대 혼동 금지). 뜬소문은 공식 의뢰가 아닌 진짜 소문 수준(보수·정보 불확실). 도시전설~도시의 별은 현상금/보상금 규모로 측정되며 높을수록 보상과 위험이 크다(도시의 별은 최상위 해결사나 조직급). 불순물은 머리가 직접 정하고 보통 머리가 해결하며 금기와 얽혀 있어 일반 해결사에게 의뢰로 제시하지 않는다(소문·사건 배경으로만 언급 가능). 등급은 보상금으로 측정되므로 낮은 등급 의뢰에도 매우 강한 적이 숨어 있을 수 있다.
여가(leisure): 의뢰 사이의 휴식·일상·비번 시간이면 true, 의뢰 수행·전투·위험 상황이면 false로 매 응답에 알린다(상점 구매는 여가일 때만 가능).
뒷골목의 밤(이 세계의 확정 규칙, 뒷골목에만 적용): 뒷골목에서는 매일 03:13~04:33에 밤이 온다. 이 시간에는 머리의 금기(녹화·촬영, 주거 침입, 파괴)를 제외한 어떤 행위도 법적 책임을 물을 수 없다. 또한 청소부라는 개체들이 수도 없이 나타나 밖에 있는 사람, 머리가 허가하지 않은 건축물, 시체를 녹여 액체로 만들고 이를 동력원으로 삼는다. 최소 3급 해결사 이상의 무력을 지니거나 머리가 허가한 거주지 안에 있어야 생존할 수 있다(3급 이상이어도 위험은 판정). 시스템이 밤 진행 여부·지역·거주지 허가·등급을 알려준다. 행동으로 시간이 흘러 이 구간을 지나면 시간 건너뛰기로 회피할 수 없고 반드시 위치·거주지 허가·등급으로 생존을 판정한다(주인공 보정 없음). 장비 등급은 가격 기준 9~1급+특색급이며 1급·특색급은 상위 1%만 가진다. 성능은 등급에 걸맞게 판정하되 등급이 승리를 보장하지 않는다.
피로도(0~100): 힘든 업무·전투·야근·끼니 거름·열악한 주거·위협·스트레스 상황이면 fatigue_delta를 올린다(가벼운 업무 +2~5, 힘든 일 +8~15, 전투 +15~30, 끼니 거름 +5~10/회). 수면·식사·휴식·좋은 시설·여가·치료는 낮춘다(식사 -3~5, 하룻밤 숙면 -20~40, 여가 -5~15, 좋은 시설이면 더 크게). 피로 70 이상이면 판정이 불리하고 실수가 늘며, 90 이상이면 부상·판단 착오 위험이 크다. 주거 환경(열악/보통/좋음)이 매일의 회복량에 영향을 준다. 주거 변경·구매는 시스템(부동산/상점 메뉴)이 처리하므로 GM은 현재 주거 환경만 반영한다. 플레이어가 집·장비를 사려 하면 상점 버튼을 안내하고, 장비는 보상·획득 때만 inv_add로 준다. 아이템 성능은 가격에 걸맞게 판정한다(싼 것은 약하고 고급은 강하되 한계가 있으며 의체·강화도 등급을 즉시 올리지 않는다).
narration 작성 규칙: 문단은 빈 줄로 구분하고 한 문단은 1~3문장으로 짧게 쓴다. 평소 전체 250자 이내, 전투·중요 장면만 500자까지. 대사는 반드시 한 줄에 하나씩 이름: "대사" 형식으로 쓴다(이름은 일관된 짧은 호칭, 미확인 인물은 복면 사내 같은 호칭. 플레이어 캐릭터의 말은 플레이어가 입력한 것만 쓴다). '첫째/둘째/셋째' 같은 나열식 서술, 번호 매기기, 마크다운 기호(**, #, -)를 쓰지 않고 자연스러운 소설체로 쓴다. 선택지는 한 줄짜리 짧은 문장으로 쓴다.

  const r=await sample.json([{role:"user",content:`Project Moon City 배경 TRPG. 지역: ${RG[R]}\n이 지역의 공방 4곳을 만들어라. 순서대로 품질: ${qls.join(", ")} (저급=낡고 허술하고 평판 나쁨, 일반=무난, 우수=명성 높은 곳). 4곳 중 정확히 1곳은 총기·탄약 전문(spec "총기·탄약")이고 나머지는 총기를 다루지 않는다. 이름은 반드시 "공방"으로 끝나게 하고 품질에 어울리는 이름·소개를 쓴다. 각각 전문 분야(무기|장비|의체|강화|혼합 중)와 15자 이내 한 줄 소개. 공식 설정과 충돌하는 고유명사(실제 Wing 이름 등)는 피한다.\nJSON 배열만, 코드펜스 금지: [{"n":"공방명","spec":"전문 분야","d":"소개"}]`}],{cache:false,modelTier:"quick"});
  const a=(Array.isArray(r)?r:(r&&r.items)||[]).filter(x=>x&&x.n).slice(0,4);
  S.wk[R]=a.map((x,i)=>{const ql=qls[i]||"일반",bs=R==="뒷골목"?pk([8,7,7,6,6,5,5,4]):(Math.random()<0.03?1:pk([6,5,5,4,4,3,3,2])),mx=bs===1?1:Math.max(2,Math.min(9,bs+(ql==="저급"?1:ql==="우수"?-1:0)));return {n:String(x.n),spec:x.spec||"혼합",d:(x.d||"").slice(0,30),ql,max:mx}});
 }catch(e){msg("[공방 목록 실패: "+(e.message||e.code||e)+"]")}
 genBusy=false;render();renderShop();
}
async function genOrder(w){
 if(genBusy)return;genBusy=true;renderShop();
 try{const sample=await claude.use("sample");if(!sample){genBusy=false;return}
  const gs=[w.max,w.max,Math.min(9,w.max+1)],isGun=w.ex||/총|탄/.test(w.spec||"");
  const r=await sample.json([{role:"user",content:`Project Moon City 배경 TRPG. 공방 "${w.n}"(${w.spec}, ${w.d}, ${w.ql||"일반"} 공방)의 확정 주문 가능 장비 3개를 만들어라. 전문 분야에 맞고 서로 달라야 하며 이 공방의 최상급 품질이다.${w.ql==="저급"?" 저급 공방이라 각 d에 결함·마감 불량 등 약점을 명시하고 q는 조악|중고|보통 중 하나.":w.ql==="우수"?" 명성 높은 우수 공방이라 q는 명품|최상급 중 하나.":""}${isGun?" 이 공방은 총기·탄약만 취급한다. 3개 중 최소 1개는 탄약(cat 소모품), 나머지는 총기(cat 무기). 이 세계는 총기 탄약이 터무니없이 비싸서 총 한 자루 값이 탄창 하나 값과 맞먹는다.":" 총기·탄약은 만들지 않는다."}\n등급·가격 범위(안): `+gs.map((g,i)=>`${i+1}번 ${gl(g)} ${fm(GP[g][0])}~${fm(GP[g][1])}`).join(", ")+`\ncat은 무기|장비|의체|강화 중 하나. 의체는 slot을 머리 의체|눈 의체|귀 의체|팔 의체|손 의체|다리 의체|몸통 의체|장기 의체 중, 강화는 강화:근력|강화:반응|강화:지구력|강화:감각|강화:회복|강화:종합 중 하나로. d는 25자 이내 한 줄.\nJSON 배열만, 코드펜스 금지: [{"cat":"","n":"","q":"정품|명품","p":숫자,"d":"","slot":""}]`}],{cache:false,modelTier:"quick"});
  const a=(Array.isArray(r)?r:(r&&r.items)||[]).slice(0,3).map((x,i)=>{const g=gs[i]||w.max,rg=GP[g],cat=(isGun?["무기","장비","의체","강화","소모품"]:["무기","장비","의체","강화"]).includes(x.cat)?x.cat:"장비";
   const o={cat,n:(()=>{const nm=String(x.n||"주문품"),pre=(w.pre||w.n)+"제 ";return nm.startsWith(pre)?nm:pre+nm})(),q:x.q||"정품",d:x.d||"",g:cat==="소모품"?null:g,wait:w.ex?60:WT[g],p:Math.round(Math.min(rg[1],Math.max(rg[0],+x.p||rg[0]))*(w.ex?((S.job==="손가락 조직원"&&S.fin==="엄지")?1.0:1.3):PM[w.ql||"일반"])/1000)*1000};
   if(cat==="의체"||cat==="강화")o.slot=x.slot||(cat==="강화"?"강화:종합":"의체");return o});
  S.orders[w.n]=a;rareCheck(a,w.n+" 주문서");autosave();
 }catch(e){msg("[주문서 실패: "+(e.message||e.code||e)+"]")}
 genBusy=false;render();renderShop();
}
function buyOrder(w,it){
 if(nightBlock(it.wait,true)){render();renderShop();return}
 const c0=S.cash;doBuy(()=>buy(it.cat,it));
 if(S.cash<c0){S.orders[w.n]=(S.orders[w.n]||[]).filter(x=>x!==it);S.t+=it.wait*60000;msg("[제작 대기] "+w.n+" — "+fmW(it.wait)+" 경과");settle()}
 autosave();render();renderShop();
}
const TC={뜬소문:"#9e9e9e",도시전설:"#43a047",도시질병:"#1e88e5",도시악몽:"#7e57c2","도시의 별":"#f5c518"};
function renderBoard(){
 const P=$("board");P.style.display=showBoard?"block":"none";if(!showBoard)return;P.innerHTML="";
 const act0=S.quest&&S.quest!=="없음",lock=!isLz()||act0;
 const h=document.createElement("p");h.className="e";h.style.cssText="font-size:12px;color:var(--mu);margin:0 0 8px";
 h.textContent="📋 의뢰 수주 게시판\n"+(act0?"🔒 진행 중인 의뢰가 있어 새 의뢰를 받을 수 없습니다":!isLz()?"🔒 지금은 업무 중이라 구경만 가능합니다 (수주는 여가 시간에)":"내 등급에 맞는 의뢰 위주로 올라옵니다. 보수와 재해등급을 보고 고르세요.");P.appendChild(h);
 const g=document.createElement("button");g.className="go";g.disabled=genBusy;g.textContent=genBusy?"의뢰를 확인하는 중…":"🔄 게시판 새로고침 (약 30~60분 소요)";g.onclick=()=>genBoard(false);P.appendChild(g);
 if(!(S.board||[]).length&&!AT.board&&!genBusy&&isLz()&&!act0){AT.board=1;setTimeout(()=>genBoard(true),0)}
 (S.board||[]).forEach(it=>{
  const b=document.createElement("button"),D=()=>document.createElement("div");
  const l1=D(),st=document.createElement("b");st.textContent=it.title;l1.appendChild(st);
  const tg=document.createElement("small");tg.textContent="  ["+it.threat+"]";tg.style.cssText="font-weight:700;color:"+TC[it.threat];l1.appendChild(tg);b.appendChild(l1);
  const l2=D();l2.textContent="+"+fm(it.reward);l2.style.cssText="color:var(--ac);font-weight:600;font-size:13px";b.appendChild(l2);
  const l3=D();l3.textContent=it.kind+" · "+it.loc+" — "+it.desc;l3.style.cssText="color:var(--mu);font-size:12px";b.appendChild(l3);
  b.style.borderLeft="5px solid "+TC[it.threat];if(lock)b.style.opacity=".65";
  b.onclick=()=>acceptQuest(it);P.appendChild(b)});
}
async function genBoard(free){
 if(genBusy)return;
 if(!free){const m=30+5*Math.floor(Math.random()*7);if(nightBlock(m)){render();return}S.t+=m*60000;S.fatigue=Math.min(100,S.fatigue+1);msg("[시간 경과] 의뢰 게시판을 살피는 데 "+m+"분 소요");settle();render()}
 genBusy=true;renderBoard();
 try{const sample=await claude.use("sample");if(!sample){msg("[AI 사용 불가]");genBusy=false;render();return}
  const r=await sample.json([{role:"user",content:`Project Moon City 배경 TRPG 의뢰 게시판. 지역: ${S.region}. 플레이어: 직업 ${S.job}, 직급 ${S.grade}, 신체제어력 ${S.ctrl}.\n의뢰 5개를 만들어라. 플레이어 등급에 맞는 의뢰 위주(4개)에 한 단계 위 도전적 의뢰 1개. 직업이 해결사가 아니면 그 직업의 업무·지시로 만든다.${S.job==="해결사"&&S.aff?" 소속: "+S.aff+"(소속 성격에 맞는 의뢰도 섞는다).":""}${S.fin?" 소속 손가락("+S.fin+")의 임무·지시로 만들고 그 손가락의 문화와 규율을 반영한다.":""} kind는 잡무|사무|보조|조사|수색|일반|호위|전투|중요 중에서 다양하게(전투만 몰리지 않게, 중요는 드물게). tier는 내부 난이도 1~3으로 대부분 1~2, 한 단계 위 의뢰만 3 가능하며 title·desc에 tier 숫자나 하급·중급·상급이라는 단어를 쓰지 않는다. threat(재해등급)는 뜬소문|도시전설|도시질병|도시악몽|도시의 별 중 하나로 현상금/보수 규모로 정해지고(뜬소문은 공식 의뢰가 아닌 소문 수준, 불순물은 쓰지 않는다) 낮은 재해등급이라도 숨은 강적이 있을 수 있으나 desc에는 드러내지 않는다. 보수 기준(안, 일반/고위험): 9급 3~6만/6~9만, 8급 6~12만/12~20만, 7급 10~20만/20~35만, 6급 20~45만/45~80만, 5급 40~90만/90~150만, 4급 80~180만/180~350만, 3급 150~350만/350~700만, 2급 400~900만/900~2000만, 1급 1500만~4000만/4000만~수억. 위험이 높을수록 보수가 높되 매번 상한을 주지 않는다. 장소는 구체적으로, 서로 비슷한 의뢰 반복 금지.\nJSON 배열만, 코드펜스 금지: [{"title":"20자 이내","kind":"","tier":1,"threat":"","reward":숫자,"loc":"","desc":"한 줄 40자 이내"}]`}],{cache:false,modelTier:"quick"});
  const ok=Object.keys(QR),th=Object.keys(TC);
  S.board=(Array.isArray(r)?r:(r&&r.items)||[]).filter(x=>x&&x.title).slice(0,6).map(x=>({title:String(x.title).slice(0,30),kind:ok.includes(x.kind)?x.kind:"일반",tier:[1,2,3].includes(+x.tier)?+x.tier:1,threat:th.includes(x.threat)?x.threat:"도시전설",reward:Math.max(1000,Math.round((+x.reward||50000)/1000)*1000),loc:String(x.loc||"").slice(0,24),desc:String(x.desc||"").slice(0,50)}));
  autosave();
 }catch(e){msg("[의뢰 생성 실패: "+(e.message||e.code||e)+"]")}
 genBusy=false;render();
}
function acceptQuest(it){
 if(busy)return;
 if(S.quest&&S.quest!=="없음"){msg("[수주 불가] 진행 중인 의뢰가 있습니다.");render();return}
 if(!isLz()){msg("[수주 불가] 여가 시간에만 의뢰를 받을 수 있습니다.");render();return}
 S.board=S.board.filter(x=>x!==it);
 const g0=rangeFor(it.kind,it.tier);
 S.qk=it.kind;S.qtier=it.tier;S.qth=it.threat;S.qn=-1;S.qt=g0[0]+Math.floor(Math.random()*(g0[1]-g0[0]+1));
 S.quest=it.title+" (+"+it.reward.toLocaleString("ko-KR")+"안) · "+it.loc+" · "+it.desc;S.lz=false;S.loc=it.loc;
 msg("[의뢰 수주] "+it.title+" ["+it.threat+"] 보수 +"+fm(it.reward));
 showBoard=false;autosave();render();
 act("방금 위 의뢰를 수주했다. quest 필드는 그대로 유지하고, 의뢰 장소로 향하는 첫 상황을 짧게 묘사하고 선택지를 제시하라.");
}
